pkg "tmux" do
  # variables
  local TPM_DIR = "@{dottr.env.home}/.config/tmux/plugins/tpm"

  # dependencies
  needs git

  # allows non-block pkg form
  pkg tmux

  # check directory
  # others:
  # check command|file|directory
  check directory TPM_DIR

  apply_if TPM_DIR do
    git -C @{TPM_DIR} pull --ff-only
  else
    git clone --depth=1 https://github.com/tmux-plugins/tpm @{TPM_DIR}
  end
end

pkg "neovim" do
  local NEOVIM_BIN_DIR = "@{dottr.env.home}/.local/opt/neovim"
  local NEOVIM_SRC_DIR = "@{dottr.env.home}/.local/src/neovim"
  local LOCAL_BIN_DIR = "@{dottr.env.home}/.local/bin"

  needs git, npm

  # No `create` for the source dir: git clone creates it, and an empty dir
  # would make the fact below true on a fresh machine.
  check directory NEOVIM_SRC_DIR

  apply_if NEOVIM_SRC_DIR do
    if [ ! -d "@{NEOVIM_SRC_DIR}/.git" ]; then
      echo "@{NEOVIM_SRC_DIR} exists but is not a git checkout" >&2
      exit 1
    fi
    git -C @{NEOVIM_SRC_DIR} fetch origin --prune
    git -C @{NEOVIM_SRC_DIR} fetch origin --tags --force
  else
    mkdir -p "$(dirname @{NEOVIM_SRC_DIR})"
    git clone https://github.com/neovim/neovim @{NEOVIM_SRC_DIR}
  end

  # Each block is its own script, so cd again here.
  apply do
    cd "@{NEOVIM_SRC_DIR}"
    if git rev-parse refs/remotes/origin/stable >/dev/null 2>&1; then
      git checkout -B stable origin/stable
    elif git rev-parse refs/tags/stable >/dev/null 2>&1; then
      git checkout -B stable refs/tags/stable
    else
      echo "Neither refs/remotes/origin/stable nor refs/tags/stable found" >&2
      exit 1
    fi

    # Always rebuild, I guess
    rm -rf build

    # Dependency CMake cache can become invalid across upstream layout changes.
    rm -rf .deps

    # Keep local/global toolchain flags from leaking into Neovim's dependency build.
    env -u LDFLAGS -u CFLAGS -u CXXFLAGS -u CPPFLAGS \
      make CMAKE_BUILD_TYPE=RelWithDebInfo \
      CMAKE_EXTRA_FLAGS="-DCMAKE_INSTALL_PREFIX=@{NEOVIM_BIN_DIR}"
    env -u LDFLAGS -u CFLAGS -u CXXFLAGS -u CPPFLAGS make install
  end

  create directory LOCAL_BIN_DIR

  apply do
    ln -sf @{NEOVIM_BIN_DIR}/bin/nvim @{LOCAL_BIN_DIR}/nvim
  end

  apply do
    npm install -g tree-sitter-cli
  end
end
